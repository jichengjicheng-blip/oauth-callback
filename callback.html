<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth 授权回调</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    font: 16px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1a1a1a;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 640px; background: #fff;
    border-radius: 14px; padding: 28px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 22px; }
  .ok { display: inline-block; background: #e8f5e9; color: #1b5e20;
        border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
  .warn { display: inline-block; background: #fff4e5; color: #8a4b00;
          border-radius: 6px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
  .codebox {
    background: #f0f2f5; border: 1px solid #d8dce2; border-radius: 10px;
    padding: 16px; margin: 16px 0;
    font: 15px/1.5 ui-monospace, Consolas, monospace;
    word-break: break-all; user-select: all; -webkit-user-select: all;
  }
  button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; background: #1d4ed8; color: #fff;
    cursor: pointer; margin-bottom: 10px;
  }
  button:active { opacity: .85; }
  button.ghost { background: #eef0f3; color: #333; }
  ol { padding-left: 22px; }
  li { margin-bottom: 8px; }
  code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px;
         font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee;
          font-size: 13px; color: #888; }
  .spin { color:#666; font-size:14px }
</style>
</head>
<body>
<div class="card">
  <h1>OAuth 授权回调</h1>
  <div class="sub">巨量引擎开放平台 · 自研投放系统</div>
  <div id="app"><div class="spin">正在解析授权结果……</div></div>
  <div class="foot">
    🔒 本页面为纯静态页面，<strong>不会把授权码发送到任何服务器</strong>——
    所有解析都在你的浏览器本地完成。可自行查看本页源码验证。
  </div>
</div>

<script>
(function () {
  var app = document.getElementById('app')
  var params = new URLSearchParams(location.search)

  // 兼容不同平台对授权码的命名
  var code = params.get('auth_code') || params.get('code') || params.get('authorization_code')
  var state = params.get('state')
  var err = params.get('error') || params.get('error_code')

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  if (err) {
    app.innerHTML =
      '<span class="warn">授权未完成</span>' +
      '<p>平台返回了错误：</p>' +
      '<div class="codebox">' + esc(params.get('error_description') || err) + '</div>' +
      '<p>请返回重新发起授权。</p>'
    return
  }

  if (!code) {
    app.innerHTML =
      '<span class="warn">没有拿到授权码</span>' +
      '<p>本页需要从授权跳转过来才会带上 <code>auth_code</code> 参数，直接打开是看不到的。</p>' +
      '<p style="margin-bottom:6px"><strong>正确用法：</strong></p>' +
      '<ol>' +
      '<li>先运行 <code>npm run oe:url</code> 生成授权链接</li>' +
      '<li>在浏览器打开该链接，登录并点「同意授权」</li>' +
      '<li>平台会跳转到本页，授权码就会显示出来</li>' +
      '</ol>' +
      '<p>如果你是从授权页跳过来的却看到这段文字，请把地址栏的完整 URL 复制出来检查一下。</p>'
    return
  }

  app.innerHTML =
    '<span class="ok">✓ 已拿到授权码</span>' +
    '<p style="margin-top:16px"><strong>复制下面这段，粘贴到终端执行：</strong></p>' +
    '<div class="codebox" id="code">' + esc(code) + '</div>' +
    '<button id="copy">复制授权码</button>' +
    '<button class="ghost" id="copyCmd">复制完整命令</button>' +
    '<ol>' +
    '<li>回到电脑，打开终端，进入项目目录</li>' +
    '<li>粘贴并执行上面复制的命令</li>' +
    '</ol>' +
    '<p style="color:#b45309"><strong>⏱ 授权码约 10 分钟内有效，且只能用一次，请尽快操作。</strong></p>' +
    (state ? '<p style="color:#666;font-size:14px">state 参数：<code>' + esc(state) + '</code></p>' : '')

  function copyText(text, btn, done) {
    var finish = function () { btn.textContent = done; setTimeout(function () { btn.textContent = done.replace('✓ ', '') }, 1800) }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(finish, function () { fallback() })
    } else { fallback() }
    function fallback() {
      var ta = document.createElement('textarea')
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'
      document.body.appendChild(ta); ta.select()
      try { document.execCommand('copy'); finish() } catch (e) { btn.textContent = '请手动长按选择复制' }
      document.body.removeChild(ta)
    }
  }

  var cmd = 'npm run oe:code -- "' + code + '"'
  document.getElementById('copy').onclick = function () { copyText(code, this, '✓ 已复制授权码') }
  document.getElementById('copyCmd').onclick = function () { copyText(cmd, this, '✓ 已复制命令') }
})()
</script>
</body>
</html>
