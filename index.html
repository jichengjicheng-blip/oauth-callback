<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth 回调页</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:#f5f6f8; color:#1a1a1a; padding:24px; }
  .card { background:#fff; border-radius:14px; padding:28px 24px; max-width:520px;
          box-shadow:0 2px 16px rgba(0,0,0,.08); }
  h1 { font-size:19px; margin:0 0 10px; }
  p { color:#555; font-size:14px; }
  a { color:#1d4ed8; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>OAuth 授权回调页</h1>
    <p>这个页面用于接收巨量引擎开放平台的授权跳转。</p>
    <p>正常使用时，你会从授权页被跳转到
       <a href="./callback.html">callback.html</a>，授权码会显示在那里。</p>
    <p style="color:#888;font-size:13px">纯静态页面，不收集、不上传任何数据。</p>
  </div>
</body>
</html>
